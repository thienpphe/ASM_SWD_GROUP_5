server.port=8080

# Default profile: H2 embedded file database with SQL Server mode
spring.datasource.url=jdbc:h2:file:./data/quizdb;AUTO_SERVER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File upload limit (for questions import)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Secret & Expiration
app.jwt.secret=9a67c7e69bcdc978cd95dd20000a6e03808544a8fb3a0c5bd84296b965c49b80f1e8e2c88f1234567890abcdef
app.jwt.expiration-ms=86400000

